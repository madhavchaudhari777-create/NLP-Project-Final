services:
  - type: web
    name: nlp-interview-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: interview-db
          property: connectionString

databases:
  - name: interview-db
    databaseName: interview_db
    user: interview_user
    plan: starter